services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # внутри сети compose БД доступна по имени сервиса и внутреннему порту
      CONN_STR: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - postgres
    networks:
      - backend

  postgres:
    image: "postgres:16"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_backups:/pgadmin/backups
    networks:
      - backend

  adminer: # Легче, чем pgAdmin!
    image: adminer
    restart: "no"
    ports:
      - 8088:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette # Красивая тема
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
